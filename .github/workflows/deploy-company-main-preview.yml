name: Deploy company-main preview

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: company-main-preview-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to VPS preview
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required files
        run: |
          set -euo pipefail
          test -f index.html
          test -f sw.js
          test -f src/modules/V4AppShell.js
          test -f src/modules/PackitAssetManifest.js
          test -f src/modules/PackitShellBranding.js
          test -f public/assets/packit/brand/dark/packit_symbol.png
          grep -q "PackitShellBranding" index.html

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PACKIT_VPS_HOST }}
          username: ${{ secrets.PACKIT_VPS_USER }}
          key: ${{ secrets.PACKIT_VPS_SSH_KEY }}
          port: ${{ secrets.PACKIT_VPS_SSH_PORT || '22' }}
          script_stop: true
          command_timeout: 10m
          script: |
            set -euo pipefail
            export PACKIT_REPO_FULL_NAME="${{ github.repository }}"
            export PACKIT_DEPLOY_REF="${{ github.ref_name }}"
            export PACKIT_DEPLOY_COMMIT="${{ github.sha }}"
            export PACKIT_APP_ROOT="/opt/packit/apps/company-main"
            export PACKIT_SERVICE_NAME="packit-company-main-preview.service"
            export PACKIT_HEALTH_PORT="8088"
            export PACKIT_DEPLOY_FILE_OWNER="packit:packit"
            export PACKIT_KEEP_RELEASES="10"

            curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/scripts/deploy-company-main-preview.sh" -o /tmp/packit-deploy-company-main-preview.sh
            chmod +x /tmp/packit-deploy-company-main-preview.sh
            /tmp/packit-deploy-company-main-preview.sh
